name: price-watch

on:
  schedule:
    - cron: "*/5 * * * *"      # every 5 minutes (GitHub may delay a few minutes under load)
  workflow_dispatch:            # lets you run it by hand from the Actions tab

permissions:
  contents: write

concurrency:
  group: price-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch prices and evaluate alerts
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          ALERT_TO:  ${{ secrets.ALERT_TO }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          POSITION_JSON: ${{ secrets.POSITION_JSON }}
        run: python fetch_price.py
      - name: Commit data
        run: |
          git config user.name  "oil-watch bot"
          git config user.email "actions@users.noreply.github.com"
          git add data alerts.json
          git diff --cached --quiet || (git commit -m "price $(date -u +%Y-%m-%dT%H:%MZ)" && git push)
