name: price-watch

on:
  schedule:
    - cron: "3 * * * *"        # hourly; each run then polls every 5 min for 55 min (loop.sh)
    - cron: "50 3 * * *"       # daily brief ~08:00 Dubai (03:50 UTC; scheduler drift lands it near 08:00)
  workflow_dispatch:            # run by hand from the Actions tab
    inputs:
      test:
        description: "Send a test alert (email + push) instead of checking prices"
        type: boolean
        default: false
      brief:
        description: "Send the position/market brief now"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  # the hourly loop holds the 'loop' slot; briefs and manual runs use 'oneshot'
  # so they never queue behind a 55-minute loop run
  group: ${{ (github.event_name == 'workflow_dispatch' || github.event.schedule == '50 3 * * *') && 'oneshot' || 'loop' }}
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.txt
      - run: pip install -q -r requirements.txt
      - name: Fetch prices / evaluate alerts / brief
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          ALERT_TO:  ${{ secrets.ALERT_TO }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          POSITION_JSON: ${{ secrets.POSITION_JSON }}
          TEST_ALERT: ${{ inputs.test }}
          BRIEF: ${{ inputs.brief || (github.event_name == 'schedule' && github.event.schedule == '50 3 * * *') }}
        run: bash loop.sh
